<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#050B1C">
<script id="theme-boot">(()=>{const d=document.documentElement,K="ssw.theme.v1";let t="dark";const read=()=>{try{return localStorage.getItem(K)==="light"?"light":"dark"}catch(e){return"dark"}},set=x=>{t=x;d.dataset.theme=x;const m=document.querySelector('meta[name="theme-color"]'),l=x==="light"?"التحويل للوضع الداكن":"التحويل للوضع الفاتح";if(m)m.content=x==="light"?"#F7F3EC":"#050B1C";for(const b of document.querySelectorAll("[data-theme-toggle]")){b.setAttribute("aria-label",l);b.title=l}};set(read());document.addEventListener("click",e=>{const b=e.target instanceof Element&&e.target.closest("[data-theme-toggle]");if(!b)return;set(t==="light"?"dark":"light");try{localStorage.setItem(K,t)}catch(e){}});document.addEventListener("DOMContentLoaded",()=>set(t));addEventListener("pageshow",e=>{if(e.persisted)set(read())})})()</script>
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>إتمام الطلب | SELECT SHOP WOMEN</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/checkout-v2.css?v=20261025">
<link rel="stylesheet" href="../css/atelier-site.css?v=20261106-theme">
<script src="../js/analytics.js?v=meta-20261030" defer></script>
<script type="module" src="../js/commerce.js?v=lp-attr-20261025"></script>
</head>
<body class="atelier-checkout">
<header class="top"><a class="mark" href="/" aria-label="SELECT SHOP WOMEN الرئيسية">SELECT</a><button type="button" class="theme-toggle" data-theme-toggle aria-label="التحويل للوضع الفاتح" title="التحويل للوضع الفاتح"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><a href="/cart/">تعديل الشنطة</a></header>
<main class="wrap">
<h1>إتمام الطلب</h1>
<form id="orderForm" novalidate>
  <label>المحافظة<select name="region" id="region" required autocomplete="address-level1"><option value="">اختيار المحافظة</option></select></label>
  <label>الاسم بالكامل<input name="name" maxlength="100" autocomplete="name" enterkeyhint="next" required></label>
  <label>رقم الموبايل<input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="18" placeholder="01xxxxxxxxx" enterkeyhint="next" required></label>
  <div class="pair">
    <label>المنطقة<input name="area" maxlength="100" autocomplete="address-level2" enterkeyhint="next" required></label>
    <label>العنوان بالتفصيل<input name="address" maxlength="350" autocomplete="street-address" enterkeyhint="done" required></label>
  </div>
  <details><summary>إضافة ملاحظة للمندوب (اختياري)</summary><label>ملاحظات<textarea name="notes" maxlength="500"></textarea></label></details>

  <section class="card" aria-label="ملخص الطلب">
    <div id="checkoutItems"></div>
    <div class="row" style="margin-top:6px"><span>المنتجات</span><b id="subtotal">—</b></div>
    <div class="row"><span>الشحن</span><b id="shipping">—</b></div>
  </section>
  <div class="totals">
    <p class="note">الدفع كاش عند الاستلام. التوافر وميعاد الشحن بيتأكدوا بعد تسجيل الطلب، والإجمالي بيتحسب من السيرفر قبل التأكيد.</p>
  </div>
  <p id="status" role="status"></p>
  <div class="confirm">
    <div class="row"><span>الإجمالي</span><b id="grandTotal">—</b></div>
    <button id="placeOrder" type="submit" disabled>تأكيد الطلب</button>
  </div>
</form>
</main>
</body>
</html>
