<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FAFAF9">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>إتمام الطلب | SELECT SHOP</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/neutral/ibm-plex-sans-arabic-arabic-400-lp.woff2" as="font" type="font/woff2" crossorigin>
<style id="women-neutral-fonts">
/* Neutral look fonts, self-hosted (OFL, assets/fonts/neutral/LICENSE-*.txt): the home's three files. Plex Arabic 400 is subset to Arabic + digits/punctuation
   (Latin letters use the system font) and is the one preloaded face; bolder Plex weights are synthesised; Alexandria 800 draws titles, Manrope 800 prices. */
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-display:swap;font-weight:400;src:url(../assets/fonts/neutral/ibm-plex-sans-arabic-arabic-400-lp.woff2) format("woff2");unicode-range:U+0020-0040,U+00A0,U+00AB,U+00BB,U+0600-06FF,U+200C-200F,U+2010-2011}
@font-face{font-family:'Alexandria';font-style:normal;font-display:swap;font-weight:800;src:url(../assets/fonts/neutral/alexandria-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Manrope';font-style:normal;font-display:swap;font-weight:800;src:url(../assets/fonts/neutral/manrope-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
</style>
<link rel="stylesheet" href="../css/checkout-v2.css?v=20261025">
<link rel="stylesheet" href="../css/atelier-site.css?v=20261114-luxe">
<link rel="stylesheet" href="../css/neutral-shop.css?v=20261122">
<script src="../js/analytics.js?v=afterload-20261121" defer></script>
<script type="module" src="../js/commerce.js?v=lead-20261120"></script>
</head>
<body class="atelier-checkout">
<header class="top"><a class="mark" href="/" aria-label="SELECT SHOP الرئيسية">SELECT</a><a href="/cart/">تعديل الشنطة</a></header>
<main class="wrap">
<h1>إتمام الطلب</h1>
<form id="orderForm" novalidate>
  <label>المحافظة<select name="region" id="region" required autocomplete="address-level1"><option value="">اختيار المحافظة</option></select></label>
  <label>الاسم بالكامل<input name="name" maxlength="100" autocomplete="name" enterkeyhint="next" required></label>
  <label>رقم الموبايل<input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="18" placeholder="01xxxxxxxxx" enterkeyhint="next" required></label>
  <div class="pair">
    <label>المنطقة<input name="area" maxlength="100" autocomplete="address-level2" enterkeyhint="next" required></label>
    <label>العنوان بالتفصيل<input name="address" maxlength="350" autocomplete="street-address" enterkeyhint="done" required></label>
  </div>
  <details><summary>إضافة ملاحظة للمندوب (اختياري)</summary><label>ملاحظات<textarea name="notes" maxlength="500"></textarea></label></details>

  <section class="card" aria-label="ملخص الطلب">
    <div id="checkoutItems"></div>
    <div class="row" style="margin-top:6px"><span>المنتجات</span><b id="subtotal">—</b></div>
    <div class="row"><span>الشحن</span><b id="shipping">—</b></div>
  </section>
  <div class="totals">
    <p class="note">الدفع كاش عند الاستلام. التوافر وميعاد الشحن بيتأكدوا بعد تسجيل الطلب، والإجمالي بيتحسب من السيرفر قبل التأكيد.</p>
  </div>
  <p id="status" role="status"></p>
  <div class="confirm">
    <div class="row"><span>الإجمالي</span><b id="grandTotal">—</b></div>
    <button id="placeOrder" type="submit" disabled>تأكيد الطلب</button>
  </div>
</form>
</main>
</body>
</html>
