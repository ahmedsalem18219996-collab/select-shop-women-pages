<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEEF2">
<title>SELECT SHOP WOMEN</title>
<meta name="description" content="اطلبي دلوقتي من SELECT SHOP WOMEN. الدفع عند الاستلام.">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/rakkas-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/readex-pro-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fonts.css">
<style>
/* Landing page for one product (ads). Same tokens and fonts as the store; reads the public catalog only. */
:root { --mirror:#ECEEF2; --chalk:#fff; --ink:#16192B; --tape:#F1CB47; --pin:#B3253D; --dust:#686D80; --hair:rgba(22,25,43,.1);
  --f-display:"Rakkas","Lalezar","Noto Kufi Arabic",serif; --f-body:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif; --f-num:"DM Mono",ui-monospace,Consolas,monospace; color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--mirror); }
body { margin: 0; background: var(--mirror); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; overflow-x: clip; }
.wrap { max-width: 560px; margin-inline: auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); }
header { padding: calc(14px + env(safe-area-inset-top, 0px)) 0 10px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: var(--f-display); font-size: 28px; line-height: 1; color: var(--ink); text-decoration: none; }
.logo small { font: 500 10px var(--f-num); letter-spacing: .14em; text-transform: uppercase; margin-inline-start: 6px; color: var(--dust); }
.all { font-size: 13px; color: var(--dust); text-decoration: none; }
.photo { position: relative; aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; background: #dfe2ea; margin-top: 6px; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tape { position: absolute; inset-inline: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(90deg, var(--tape) 0 2px, transparent 2px 12px); opacity: .9; }
.tag { position: absolute; top: 12px; inset-inline-start: 12px; background: var(--pin); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 8vw, 40px); line-height: 1.15; margin: 18px 0 6px; overflow-wrap: anywhere; }
.price { font: 500 26px var(--f-num); }
.price small { font: 400 13px var(--f-body); color: var(--dust); margin-inline-start: 4px; }
ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
li { display: flex; gap: 10px; align-items: center; background: var(--chalk); border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
li b { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tape); font-weight: 700; }
.bar { position: fixed; inset-inline: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--mirror) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--hair); }
.bar > div { max-width: 560px; margin-inline: auto; display: flex; gap: 10px; }
.cta { flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: var(--ink); color: #fff; font: 500 16px var(--f-body); text-decoration: none; }
.cta[aria-disabled="true"] { background: #B9BCC8; pointer-events: none; }
.wa { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--chalk); border: 1px solid var(--hair); color: var(--ink); text-decoration: none; font-size: 12px; }
.note { text-align: center; color: var(--dust); padding: 56px 8px; }
.skel { background: linear-gradient(90deg, #dfe2ea, #eceef2, #dfe2ea); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/select-shop-women-pages/" aria-label="SELECT SHOP WOMEN"><b style="font-weight:400">select</b><small>shop woman</small></a><a class="all" href="/select-shop-women-pages/">كل المنتجات</a></header>
  <main id="main" aria-live="polite">
    <div class="photo skel"></div>
    <h1 class="skel" style="height:44px;border-radius:10px"></h1>
  </main>
</div>
<div class="bar" id="bar" hidden><div><a class="cta" id="cta" href="#" aria-disabled="true">اطلبي دلوقتي</a><a class="wa" id="wa" href="#" hidden aria-label="واتساب">واتساب</a></div></div>
<script src="lp.js" defer></script>
</body>
</html>
