name: WOMEN live links smoke (manual only)
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - .github/workflows/women-live-links-smoke.yml

permissions:
  contents: read

jobs:
  live-links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public DNS from Google and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for name in selectshopeg.com www.selectshopeg.com; do
            for resolver in 1.1.1.1 8.8.8.8; do
              response=$(dig +short +time=6 +tries=1 "@$resolver" "$name" A)
              echo "$name DNS via $resolver: $response"
              if ! grep -Eq '185\.199\.(108|109|110|111)\.153' <<< "$response"; then
                echo "::error::Public DNS does not currently resolve $name to the expected GitHub Pages IPv4 at $resolver"
                exit 1
              fi
            done
          done

      - name: Check HTTPS homepage, www redirect, and two product HTML routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 1 --connect-timeout 10 --max-time 30 "https://selectshopeg.com/" -o /tmp/women-home.html
          grep -Fq 'js/store-adapter.js?v=webview-20261024' /tmp/women-home.html
          echo "PASS: apex homepage HTTPS and new cached JS version"
          curl -fLSs --retry 1 --connect-timeout 10 --max-time 30 "https://www.selectshopeg.com/" -o /tmp/women-www.html
          grep -Fq 'js/store-adapter.js?v=webview-20261024' /tmp/women-www.html
          echo "PASS: www HTTPS and new cached JS version"
          for code in SS-1011 SS-1043; do
            curl -fLSs --retry 1 --connect-timeout 10 --max-time 30 "https://selectshopeg.com/p/?code=$code" -o "/tmp/women-$code.html"
            grep -Fq '../js/commerce.js?v=product-recovery-20261024-1' "/tmp/women-$code.html"
            echo "PASS: direct product link HTTPS and JS $code"
          done

      - name: Verify both products load from WOMEN public backend (read only)
        shell: bash
        run: |
          set -euo pipefail
          for code in SS-1011 SS-1043; do
            curl -fLSs --retry 1 --connect-timeout 10 --max-time 30 -H 'Accept: application/json' -H 'Origin: https://selectshopeg.com' \
              "https://byluoipdunralsurwebt.supabase.co/functions/v1/women-checkout/product/$code" \
              -o "/tmp/api-$code.json"
            python3 - "$code" <<'PY'
          import json,sys
          code=sys.argv[1]
          with open('/tmp/api-'+code+'.json',encoding='utf-8') as f:
              data=json.load(f)
          p=data.get('product')
          assert isinstance(p,dict) and p.get('publicCode') == code, 'Unexpected product payload or missing item '+code
          assert isinstance(p.get('variants'),list) and isinstance(p.get('options'),list), 'Incomplete product '+code
          print('PASS: WOMEN backend returned product '+code)
          PY
          done

      - name: Mobile browser end-to-end product rendering (no orders or analytics)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then npx playwright install chromium; fi
          CHROME_BIN="$CHROME" node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN||undefined,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const cases=[
                {code:'SS-1011',host:'selectshopeg.com',fb:false,interrupt:false},
                {code:'SS-1043',host:'selectshopeg.com',fb:true,interrupt:false},
                {code:'SS-1011',host:'www.selectshopeg.com',fb:true,interrupt:false},
                {code:'SS-1043',host:'www.selectshopeg.com',fb:false,interrupt:true},
              ];
              for(const test of cases){
                const ctx=await browser.newContext({
                  viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'ar-EG',
                  serviceWorkers:'block',
                  ...(test.fb?{userAgent:'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36 [FB_IAB/FB4A;FBAV/580.0.0.51.74;IABMV/1;]'}:{})
                });
                const page=await ctx.newPage();
                const errs=[], productRequests=[];
                let interrupted=false;
                page.on('pageerror', e=>errs.push(e.message.slice(0,180)));
                page.on('response',res=>{
                  if(res.url().includes('/women-checkout/product/'))productRequests.push(res.status());
                });
                page.on('requestfailed',req=>{
                  if(req.url().includes('/women-checkout/product/'))productRequests.push('failed:'+String(req.failure()?.errorText).slice(0,100));
                });
                await page.route('**/*', route=>{
                  const req=route.request(),u=new URL(req.url());
                  if(u.pathname.includes('/women-product-views')||u.hostname.includes('google-analytics')||
                      u.hostname.includes('googletagmanager')||u.hostname.includes('facebook.net')||
                      u.hostname.includes('facebook.com')||req.method()==='POST'){
                    return route.abort();
                  }
                  if(test.interrupt&&!interrupted&&u.pathname.includes('/women-checkout/product/')){
                    interrupted=true;
                    return route.abort('failed');
                  }
                  return route.continue();
                });
                const url='https://'+test.host+'/p/?code='+test.code;
                const nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:40000});
                await page.waitForFunction(code=>{
                  const id=document.querySelector('#productCode')?.textContent?.trim();
                  const h=document.querySelector('#productTitle')?.textContent||'';
                  return id===code || h.includes('تعذر تحميل') || h.includes('غير متاح');
                },test.code,{timeout:40000});
                const dom=await page.evaluate(()=>{
                  return {
                    code:document.querySelector('#productCode')?.textContent?.trim(),
                    title:document.querySelector('#productTitle')?.textContent?.trim(),
                    status:document.querySelector('#status')?.textContent?.trim(),
                    price:document.querySelector('#productPrice')?.textContent?.trim(),
                    img:document.querySelector('#productPhoto')?.getAttribute('src')||''
                  };
                });
                const pass=nav?.status()===200 && dom.code===test.code && !!dom.title && !dom.title.includes('تعذر تحميل') &&
                           (!test.interrupt||interrupted);
                console.log(JSON.stringify({test:{code:test.code,host:test.host,fb:test.fb,interrupt:test.interrupt},http:nav?.status(),
                           finalHost:new URL(page.url()).hostname,dom,productRequests,errs,pass}));
                await ctx.close();
                if(!pass)throw Error('Mobile browser product rendering FAILED: '+test.code+' '+test.host);
              }
              console.log('PASS: actual mobile browser rendered both product detail pages, www redirect and one transient network error');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
