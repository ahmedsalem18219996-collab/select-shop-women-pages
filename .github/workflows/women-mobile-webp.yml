name: WOMEN responsive mobile WebP candidate

on:
  push:
    branches:
      - perf/mobile-first-frame-w400-20261021
    paths:
      - scripts/build_mobile_webp.py
      - .github/workflows/women-mobile-webp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-w400:
    if: github.ref == 'refs/heads/perf/mobile-first-frame-w400-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate the smaller responsive assets
        run: python scripts/build_mobile_webp.py
      - name: Commit ONLY mobile derivatives to isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "perf/mobile-first-frame-w400-20261021"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/catalog-thumbs/*.w400.webp'
          if ! git diff --cached --quiet; then
            git commit -m "perf(WOMEN): responsive 400px thumbnail derivatives [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
