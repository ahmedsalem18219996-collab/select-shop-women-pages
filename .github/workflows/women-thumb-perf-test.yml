name: WOMEN static thumbnails — isolated test branch

on:
  push:
    branches:
      - perf/mobile-first-images-catalog-20261021
    paths:
      - scripts/build_catalog_thumbs.py
      - .github/workflows/women-thumb-perf-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbs:
    if: github.ref == 'refs/heads/perf/mobile-first-images-catalog-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline thumbnail encoder
        run: python -m pip install Pillow==11.3.0
      - name: Check syntax
        run: |
          python -m py_compile scripts/build_catalog_thumbs.py
          node --check js/store-adapter.js
          node --check js/catalog-thumbs.js
      - name: Generate static catalog WebP images from public photos
        run: python scripts/build_catalog_thumbs.py
      - name: Commit only non-production thumbnail assets to this branch
        run: |
          test "$GITHUB_REF_NAME" = "perf/mobile-first-images-catalog-20261021"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/catalog-thumbs.js assets/catalog-thumbs/
          if ! git diff --cached --quiet; then
            git commit -m "perf: build static WOMEN catalog thumbnails [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
